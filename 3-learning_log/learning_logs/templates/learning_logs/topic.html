{% extends 'learning_logs/base.html' %}

{% block content %}
    <h2> Tópico: {{topic.text}}</h2>
    <ul>
        {% for entry in entries%}
            <li>
                <p>{{entry.text | linebreaks}}</p>
                <p>{{entry.date_added | date:"M d, Y H:i"}}</p>
            </li>
            {% empty %}
                <li>Não há entradas para este tópico.</li>
        {%endfor%}
    </ul>
{% endblock%}
